@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{position:relative;top:auto}.toc nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}}
@media(max-width:600px){.wrap{padding:14px 10px 55px}.hero{padding:30px 22px;border-radius:19px}.system-section{padding:24px 18px;border-radius:18px}.section-head h2{font-size:23px}.logo{width:60px;height:60px;right:12px;top:12px}.logo-name{font-size:5px}.logo-mb{font-size:18px}.top{left:12px;bottom:14px;width:42px;height:42px;font-size:22px}.toc nav{grid-template-columns:1fr}}
.roadmap-block{margin:18px 0 28px;padding:24px 26px;background:#f7faf8;border:1px solid var(--line);border-radius:16px;overflow:auto}.roadmap-block h2{margin:0 0 18px!important;color:#123b2a!important}.roadmap-tree{font-family:"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px;line-height:1.7;white-space:pre;min-width:max-content}.roadmap-line{white-space:pre}.roadmap-line.ltr{text-align:left}.roadmap-line.rtl{text-align:right}</style>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const MD_URL = "https://raw.githubusercontent.com/BKHSHNDH/IELTS-WRITING-ARTICLE-TO-WRITING-SYSTEM/main/IELTS%20WRITING%20%C2%B7%20ARTICLE-TO-WRITING%20SYSTEM.md";

const roadmap = [
 {id:"s01",n:"01",title:"WRITING TASK STARTING POINT",keys:["starting point","actual writing question","write the exact task","identify the topic","identify the task instruction"]},
 {id:"s02",n:"02",title:"PRE-WRITING QUESTION ANALYSIS",keys:["pre-writing question analysis","what do i need to know","break the topic into issues","build my search questions"]},
 {id:"s03",n:"03",title:"TASK-COMPLETION CHECK",keys:["task-completion checklist","task-completion check","final gate","ready to search"]},
 {id:"s04",n:"04",title:"SEARCH & RESEARCH PREPARATION",keys:["search preparation","search road map","search with a purpose","cambridge reading sources","research","one search, two benefits"]},
 {id:"s05",n:"05",title:"ARTICLE / SOURCE SELECTION",keys:["source selection","authentic sources","source / organisation","relevant, credible","is the source relevant"]},
 {id:"s06",n:"06",title:"ARTICLE UNDERSTANDING & KNOWLEDGE EXTRACTION",keys:["how to extract writing ideas","understand the article","extract knowledge","article understanding","collect knowledge","article facts","knowledge"]},
 {id:"s07",n:"07",title:"FACT → IDEA",keys:["fact vs idea","fact → idea","article-specific writing prompts","generate possible writing ideas","my writing idea","my ideas"]},
 {id:"s08",n:"08",title:"EVIDENCE → EXPLANATION",keys:["evidence → explanation","evidence","connection","explanation","mechanism","significance","qualification"]},
 {id:"s09",n:"09",title:"ARGUMENT DEVELOPMENT",keys:["argument development","develop the argument","possible argument","what?","why?","how?","result?","example?"]},
 {id:"s10",n:"10",title:"POSITION BUILDING",keys:["position building","your position","my position","what do i believe","add your own thinking","other side"]},
 {id:"s11",n:"11",title:"PARAGRAPH DEVELOPMENT",keys:["paragraph plan","paragraph development","ielts paragraph","main idea","development","link to the question"]},
 {id:"s12",n:"12",title:"ESSAY CONSTRUCTION",keys:["essay construction","writing plan","full essay","conclusion","thesis","body paragraph"]},
 {id:"s13",n:"13",title:"FINAL CHECK",keys:["final check","final quality","quality check","task response","coherence","lexical resource","grammatical range"]}
];

function norm(s){return s.toLowerCase().replace(/[–—]/g,"-").replace(/→/g,"->").replace(/[^a-z0-9\s\-#]/g," ").replace(/\s+/g," ").trim();}

function splitBlocks(md){
  const lines=md.replace(/\r/g,"").split("\n");
  const blocks=[]; let cur=[];
  for(const line of lines){
    if(/^#{1,6}\s+/.test(line) && cur.some(x=>x.trim())){
      blocks.push(cur.join("\n").trim());
      cur=[line];
    }else cur.push(line);
  }
  if(cur.some(x=>x.trim())) blocks.push(cur.join("\n").trim());
  return blocks.filter(Boolean);
}
function headingOf(block){
  const m=block.match(/^#{1,6}\s+(.+)$/m);
  return m ? m[1].replace(/[*_`]/g,"").trim() : "";
}
function classify(block){
  const h=norm(headingOf(block)), n=norm(block);
  if(/cambridge\s*21/.test(h) || /cambridge\s*21/.test(n)) return "cambridge";

  const exact={
    s01:["writing task starting point","starting point"],
    s02:["pre-writing question analysis","question analysis"],
    s03:["task-completion checklist","task-completion check","final gate"],
    s04:["search preparation","search road map","your search road map","one search two benefits"],
    s05:["article / source selection","source selection","authentic sources"],
    s06:["how to extract writing ideas from an authentic article","article understanding","knowledge extraction","extract knowledge"],
    s07:["fact vs idea check","fact vs idea","article-specific writing prompts","my writing idea","generate my idea"],
    s08:["evidence explanation","evidence -> explanation"],
    s09:["argument development","build my argument","develop the argument"],
    s10:["position building","my position","your position","add your own thinking"],
    s11:["paragraph plan","paragraph development"],
    s12:["essay construction"],
    s13:["final check","final quality check"]
  };
  for(const id in exact){
    if(exact[id].some(k=>h.includes(norm(k)))) return id;
  }

  const signals={
    s01:["exact task","specific issue","task instruction","question type","scope / limits","initial understanding"],
    s02:["what is the question really about","what am i being asked to do","break the topic into issues","what do i already know","what do i need to know","turn knowledge gaps into questions"],
    s03:["do i understand the topic","do i understand the task","have i identified the relevant issues","am i ready to search"],
    s04:["build search questions","build search terms","search broadly","narrow the search","trace cambridge sources","find authentic sources","search road map"],
    s05:["is the source relevant","is it authentic","does it address my question","what aspect does it help me understand","what is my purpose for reading","source / organisation"],
    s06:["understand the article","find the connection","identify relevant information","extract article facts","collect knowledge","read with a purpose"],
    s07:["what does the article say","what do i think","fact vs idea","benefit / problem","other side","my interpretation","my writing idea"],
    s08:["evidence","connection","explanation","mechanism","result","significance","qualification"],
    s09:["argument","why","how","evidence / example","explanation","result","qualification"],
    s10:["what do i believe","strongest argument","other side","how strongly do i agree","my position"],
    s11:["main idea","development / mechanism","explanation of evidence","link to question","paragraph plan"],
    s12:["essay construction","introduction","body paragraph","conclusion","thesis"],
    s13:["final check","task response","coherence","lexical resource","grammatical range"]
  };
  let best="s04", bestScore=0;
  for(const id in signals){
    let sc=0;
    for(const k of signals[id]){
      const nk=norm(k);
      if(nk && n.includes(nk)) sc += nk.length>12 ? 5 : 2;
    }
    if(sc>bestScore){best=id;bestScore=sc;}
  }
  if(!headingOf(block) && /source organisation|original text article|source link|status/.test(n)) return "s05";
  return best;
}

function directionForText(s){
  const fa=(s.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/g)||[]).length;
  const en=(s.match(/[A-Za-z]/g)||[]).length;
  if(fa>0 && en===0) return "rtl";
  if(en>0 && fa===0) return "ltr";
  if(fa>en*0.35) return "rtl";
  if(en>fa*0.35) return "ltr";
  return "mixed";
}
function decorateBidi(root){
  root.querySelectorAll("h1,h2,h3,h4,p,li,blockquote,th,td").forEach(el=>{
    const t=el.textContent.trim();
    if(!t) return;
    const d=directionForText(t);
    el.classList.remove("rtl","ltr","mixed");
    el.classList.add(d);
    el.setAttribute("dir",d==="rtl"?"rtl":"ltr");
  });
  root.querySelectorAll("ul,ol").forEach(list=>{
    if(directionForText(list.textContent)==="rtl") list.classList.add("rtl-list");
    else list.classList.remove("rtl-list");
  });
  root.querySelectorAll("table").forEach(table=>{
    const wrap=table.closest(".table-wrap")||table.parentElement;
    if(wrap){
      wrap.classList.remove("rtl-table","ltr-table");
      wrap.classList.add(directionForText(table.textContent)==="rtl"?"rtl-table":"ltr-table");
    }
  });
}
function renderBlock(block){
  // Render the complete source block. Never discard text around a fenced tree.
  // Only the specific IELTS roadmap code fence gets special visual treatment.
  const roadmapRe=/^(##\\s+🌳\\s+IELTS WRITING · ARTICLE-TO-WRITING SYSTEM[\\s\\S]*?)$/im;
  if(roadmapRe.test(block)){
    const fenceRe=/\\`\\`\\`[\\s\\S]*?\\n([\\s\\S]*?)\\n\\`\\`\\`/;
    const fm=block.match(fenceRe);
    if(fm){
      const before=block.slice(0,fm.index);
      const after=block.slice((fm.index||0)+fm[0].length);
      let beforeHtml=before.trim()?marked.parse(before,{gfm:true,breaks:true}):"";
      let afterHtml=after.trim()?marked.parse(after,{gfm:true,breaks:true}):"";
      const lines=fm[1].split("\\n");
      const tree=lines.map(line=>{
        const safe=line.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        return '<div class="roadmap-line ltr" dir="ltr">'+safe+'</div>';
      }).join("");
      const holder=document.createElement("div");
      holder.innerHTML=beforeHtml+
        '<div class="roadmap-block"><div class="roadmap-tree">'+tree+'</div></div>'+
        afterHtml;
      decorateBidi(holder);
      return holder.innerHTML;
    }
  }
  let html=marked.parse(block,{gfm:true,breaks:true});
  html=html.replace(/<table>/g,'<div class="table-wrap"><table>')
           .replace(/<\\/table>/g,'</table></div>');
  const holder=document.createElement("div");
  holder.innerHTML=html;
  decorateBidi(holder);
  return holder.innerHTML;
}

function sectionIntro(id){
  const x=roadmap.find(s=>s.id===id);
  return x ? x.title : "";
}

async function init(){
  const main=document.getElementById("main");
  try{
    const res=await fetch(MD_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("Markdown file could not be loaded.");
    const md=await res.text();
    const blocks=splitBlocks(md);
    const groups=Object.fromEntries(roadmap.map(s=>[s.id,[]]));
    let cambridge=[];
    for(const b of blocks){
      const c=classify(b);
      if(c==="cambridge") cambridge.push(b); else groups[c].push(b);
    }

    // Put the source/reference bank with research/source work.
    if(groups.s05.length===0 && groups.s04.length) groups.s05.push(...groups.s04.splice(Math.max(0,groups.s04.length-1)));

    main.innerHTML="";
    const toc=document.getElementById("toc");
    toc.innerHTML="";

    for(const s of roadmap){
      const sec=document.createElement("section");
      sec.className="system-section";
      sec.id=s.id;
      const head=document.createElement("div");
      head.className="section-head";
      head.innerHTML='<div class="num">'+s.n+'</div><div><h2>'+s.title+'</h2><p>Step '+s.n+' · student learning path</p></div>';
      const body=document.createElement("div");
      body.className="content";
      if(groups[s.id].length){
        body.innerHTML=groups[s.id].map(renderBlock).join('<hr>');
      }else{
        body.innerHTML='<p class="source-note">No source material was mapped to this stage.</p>';
      }
      sec.append(head,body); main.appendChild(sec); decorateBidi(body);

      const a=document.createElement("a");
      a.href="#"+s.id; a.textContent=s.n+" · "+s.title; toc.appendChild(a);
    }

    const cam=document.createElement("section");
    cam.className="system-section cambridge";
    cam.id="cambridge21";
    cam.innerHTML='<div class="section-head"><div class="num">C21</div><div><h2>CAMBRIDGE 21</h2><p>Separate Cambridge 21 practice area</p></div></div><div class="content"><p>Cambridge 21 is kept separate from the main 01 → 13 learning path.</p>'+ (cambridge.length ? cambridge.map(renderBlock).join("<hr>") : '<p>No Cambridge 21 material is currently identified in the Markdown source. This area is intentionally kept separate and ready for the Cambridge 21 materials.</p>') +'</div>';
    main.appendChild(cam); decorateBidi(cam.querySelector(".content"));
    const ca=document.createElement("a");ca.href="#cambridge21";ca.textContent="C21 · CAMBRIDGE 21";toc.appendChild(ca);

    const links=[...toc.querySelectorAll("a")];
    const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id));}}),{rootMargin:"-20% 0px -65% 0px"});
    document.querySelectorAll(".system-section").forEach(x=>obs.observe(x));
  }catch(err){
    main.innerHTML='<div class="system-section"><div class="error"><strong>Unable to load the Markdown source.</strong><br>'+err.message+'</div></div>';
  }
}
init();
</script>
