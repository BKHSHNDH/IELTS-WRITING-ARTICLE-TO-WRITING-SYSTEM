<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#17211b;--muted:#5f6f65;--line:#dfe7e1;--accent:#16835b;--accent2:#0f6a49;--soft:#edf6f1;--shadow:0 12px 35px rgba(20,50,35,.07)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(135deg,#f4f8f5,#edf4ef);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.75}
body,.page{direction:ltr}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 80px}
.hero{position:relative;background:linear-gradient(135deg,#0f6a49,#16835b);color:#fff;border-radius:26px;padding:46px 40px;margin-bottom:22px;box-shadow:0 18px 45px rgba(15,106,73,.18);overflow:hidden}
.hero:after{content:"";position:absolute;width:320px;height:320px;border:1px solid rgba(255,255,255,.13);border-radius:50%;right:-110px;top:-140px}
.hero h1{margin:0 0 10px;font-size:clamp(30px,4vw,48px);line-height:1.15;letter-spacing:-.5px}
.hero p{margin:0;opacity:.9;font-size:17px;max-width:780px}
.hero .path{margin-top:18px;font-size:13px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.toc{position:sticky;top:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.toc-title{font-weight:800;color:#123b2a;padding:8px 10px 12px}
.toc a{display:block;text-decoration:none;color:var(--muted);padding:9px 10px;border-radius:10px;font-size:13px;line-height:1.35}
.toc a:hover,.toc a.active{background:var(--soft);color:var(--accent2);font-weight:750}
.main{min-width:0}
.system-section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 34px;margin-bottom:20px;box-shadow:var(--shadow);scroll-margin-top:18px}
.section-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.num{flex:0 0 auto;width:50px;height:50px;border-radius:15px;background:var(--soft);color:var(--accent2);display:grid;place-items:center;font-weight:900;font-size:15px}
.section-head h2{margin:2px 0 0;color:#123b2a;font-size:27px;line-height:1.25}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.content{direction:ltr;text-align:left;unicode-bidi:plaintext}
.content .rtl{direction:rtl;text-align:right;unicode-bidi:plaintext}
.content .ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}
.content h1,.content h2,.content h3,.content h4,.content p,.content li,.content blockquote,.content th,.content td{unicode-bidi:plaintext}
.content ul,.content ol{padding-left:27px;padding-right:27px}
.content .rtl-list{direction:rtl;text-align:right;padding-right:27px;padding-left:0}

.content h1,.content h2,.content h3,.content h4{text-align:left;color:#123b2a;line-height:1.3;margin-top:1.6em}
.content h1{font-size:30px;border-bottom:1px solid var(--line);padding-bottom:9px}
.content h2{font-size:25px}
.content h3{font-size:20px}
.content h4{font-size:17px}
.content p{margin:13px 0}
.content ul,.content ol{padding-left:27px}
.content li{margin:4px 0}
.content strong{color:#0d6848}
.content blockquote{margin:18px 0;padding:14px 18px;border-left:4px solid var(--accent);background:#f1f7f3;border-radius:0 12px 12px 0}
.content hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.content code{background:#eef4f0;padding:2px 6px;border-radius:6px;font-size:.92em}
.content pre{overflow:auto;background:#10251c;color:#e9f5ef;padding:16px;border-radius:14px}
.table-wrap{overflow-x:auto;margin:18px 0}
.content table{width:100%;border-collapse:collapse;min-width:620px}
.content th,.content td{vertical-align:top;border:1px solid var(--line);padding:10px 12px;text-align:left}
.content th{background:#edf6f1;color:#123b2a;font-weight:750}
.content tr:nth-child(even) td{background:#fafcfb}
.content a{color:var(--accent2);font-weight:650}
.content input[type=checkbox]{accent-color:var(--accent)}
.cambridge{background:linear-gradient(135deg,#123b2a,#0f6a49);color:#fff;border:0}
.cambridge .section-head{border-color:rgba(255,255,255,.18)}
.cambridge .section-head h2,.cambridge .section-head p{color:#fff}
.cambridge .num{background:rgba(255,255,255,.14);color:#fff}
.source-note{font-size:13px;color:var(--muted);margin:4px 0 24px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.error{padding:20px;border-radius:14px;background:#fff0f0;color:#8a2d2d;border:1px solid #efcccc}
.logo{position:fixed;right:22px;top:22px;width:72px;height:72px;z-index:2000;filter:drop-shadow(0 8px 18px rgba(15,106,73,.2))}
.logo svg{width:100%;height:100%;display:block}
.logo-bg{fill:rgba(255,255,255,.97);stroke:var(--accent);stroke-width:2.5}
.logo-name{font-family:Arial,sans-serif;font-size:5.2px;font-weight:800;letter-spacing:1.1px;fill:var(--accent2);text-transform:uppercase}
.logo-mb{font-family:Arial,sans-serif;font-size:17px;font-weight:900;letter-spacing:2px;fill:var(--accent2)}
.top{position:fixed;left:22px;bottom:22px;width:46px;height:46px;z-index:2000;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#123b2a;color:#fff;text-decoration:none;font-size:25px;font-weight:700;box-shadow:0 8px 22px rgba(18,59,42,.25);transition:.2s}
.top:hover{transform:translateY(-3px);background:var(--accent)}
.meta{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{position:relative;top:auto}.toc nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}}
@media(max-width:600px){.wrap{padding:14px 10px 55px}.hero{padding:30px 22px;border-radius:19px}.system-section{padding:24px 18px;border-radius:18px}.section-head h2{font-size:23px}.logo{width:60px;height:60px;right:12px;top:12px}.logo-name{font-size:5px}.logo-mb{font-size:18px}.top{left:12px;bottom:14px;width:42px;height:42px;font-size:22px}.toc nav{grid-template-columns:1fr}}
</style>

<div class="wrap">
<header class="hero">
<h1>✍️ IELTS WRITING TASK 2</h1>
<p>ARTICLE → KNOWLEDGE → IDEA → ARGUMENT → POSITION → WRITING</p>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const MD_URL = "https://raw.githubusercontent.com/BKHSHNDH/IELTS-WRITING-ARTICLE-TO-WRITING-SYSTEM/main/IELTS%20WRITING%20%C2%B7%20ARTICLE-TO-WRITING%20SYSTEM.md";
const roadmap=[
{id:"s01",n:"01",title:"WRITING TASK STARTING POINT"},
{id:"s02",n:"02",title:"PRE-WRITING QUESTION ANALYSIS"},
{id:"s03",n:"03",title:"TASK-COMPLETION CHECK"},
{id:"s04",n:"04",title:"SEARCH & RESEARCH PREPARATION"},
{id:"s05",n:"05",title:"ARTICLE / SOURCE SELECTION"},
{id:"s06",n:"06",title:"ARTICLE UNDERSTANDING & KNOWLEDGE EXTRACTION"},
{id:"s07",n:"07",title:"FACT → IDEA"},
{id:"s08",n:"08",title:"EVIDENCE → EXPLANATION"},
{id:"s09",n:"09",title:"ARGUMENT DEVELOPMENT"},
{id:"s10",n:"10",title:"POSITION BUILDING"},
{id:"s11",n:"11",title:"PARAGRAPH DEVELOPMENT"},
{id:"s12",n:"12",title:"ESSAY CONSTRUCTION"},
{id:"s13",n:"13",title:"FINAL CHECK"}];

function norm(s){return s.toLowerCase().replace(/[–—]/g,"-").replace(/→/g,"->").replace(/[^a-z0-9\s\-#]/g," ").replace(/\s+/g," ").trim();}
function splitBlocks(md){
 const lines=md.replace(/\r/g,"").split("\n"), blocks=[]; let cur=[];
 for(const line of lines){
  if(/^#\s+/.test(line)&&cur.some(x=>x.trim())){blocks.push(cur.join("\n").trim());cur=[line];}
  else cur.push(line);
 }
 if(cur.some(x=>x.trim())) blocks.push(cur.join("\n").trim());
 return blocks.filter(Boolean);
}
function heading(block){const m=block.match(/^#\s+(.+)$/m);return m?m[1].replace(/[*_`]/g,"").trim():"";}

function classify(block){
 const h=heading(block).trim(), hn=norm(h);
 if(/cambridge\s*21/.test(hn)) return "cambridge";
 if(hn.includes("writing task")&&hn.includes("starting point")) return "s01";
 if(hn==="pre-writing question analysis") return "s02";
 if(hn==="task-completion checklist") return "s03";
 if(hn.includes("learning tip")||hn.includes("your search road map")) return "s04";
 if(hn.includes("idea extraction road map")||hn.includes("how to extract writing ideas")||hn.includes("complete transfer process")||hn.includes("article -> writing transfer tree")||hn.includes("practice worksheet")) return "s06";
 if(hn==="5. article-specific writing prompts"||hn==="6. my writing idea") return "s07";
 if(hn==="7. evidence -> explanation") return "s08";
 if(hn==="8. build my argument") return "s09";
 if(hn==="9. my position") return "s10";
 if(hn==="10. paragraph plan") return "s11";
 if(hn.includes("evidence -> explanation")||hn.includes("evidence")) return "s08";
 if(hn.includes("build my argument")||hn.includes("argument")) return "s09";
 if(hn.includes("my position")||hn.includes("position")) return "s10";
 if(hn.includes("paragraph plan")||hn.includes("paragraph")) return "s11";
 if(hn.includes("essay construction")||hn.includes("essay")) return "s12";
 if(hn.includes("final check")) return "s13";
 if(hn.includes("article -> writing")){
   if(/fact|writing prompts|final transfer|guided answer/.test(hn)) return "s07";
   return "s06";
 }
 if(hn.includes("final transfer")||hn.includes("guided answer worksheet")||hn.includes("article-specific writing prompts")||hn.includes("writing idea")) return "s07";
 return "s06";
}

function directionForText(s){
 const fa=(s.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/g)||[]).length;
 const en=(s.match(/[A-Za-z]/g)||[]).length;
 return fa&&!en?"rtl":(!fa&&en?"ltr":(fa>en*.35?"rtl":"ltr"));
}
function decorate(root){
 root.querySelectorAll("h1,h2,h3,h4,h5,h6,p,li,blockquote,th,td").forEach(el=>{
  const t=el.textContent.trim();if(!t)return;
  const d=directionForText(t);el.classList.remove("rtl","ltr");el.classList.add(d);el.dir=d;
 });
 root.querySelectorAll("ul,ol").forEach(x=>x.classList.toggle("rtl-list",directionForText(x.textContent)==="rtl"));
}
function renderBlock(block){
 const holder=document.createElement("div");
 let html=marked.parse(block,{gfm:true,breaks:true});
 html=html.replace(/<table>/g,'<div class="table-wrap"><table>').replace(/<\/table>/g,'</table></div>');
 holder.innerHTML=html;decorate(holder);return holder.innerHTML;
}
async function init(){
 const main=document.getElementById("main");
 try{
  const res=await fetch(MD_URL,{cache:"no-store"});if(!res.ok)throw new Error("Markdown file could not be loaded.");
  const blocks=splitBlocks(await res.text());
  const groups=Object.fromEntries(roadmap.map(x=>[x.id,[]])),cambridge=[];
  for(const block of blocks){const id=classify(block);id==="cambridge"?cambridge.push(block):groups[id].push(block);}
  main.innerHTML="";const toc=document.getElementById("toc");toc.innerHTML="";
  for(const s of roadmap){
   const sec=document.createElement("section");sec.className="system-section";sec.id=s.id;
   sec.innerHTML='<div class="section-head"><div class="num">'+s.n+'</div><div><h2>'+s.title+'</h2><p>Step '+s.n+' · student learning path</p></div></div>';
   const body=document.createElement("div");body.className="content";
   body.innerHTML=groups[s.id].length?groups[s.id].map(renderBlock).join("<hr>"):'<p class="source-note">No source block was mapped to this stage.</p>';
   sec.appendChild(body);main.appendChild(sec);
   const a=document.createElement("a");a.href="#"+s.id;a.textContent=s.n+" · "+s.title;toc.appendChild(a);
  }
  const cam=document.createElement("section");cam.className="system-section cambridge";cam.id="cambridge21";
  cam.innerHTML='<div class="section-head"><div class="num">C21</div><div><h2>CAMBRIDGE 21</h2><p>Separate Cambridge 21 practice area</p></div></div><div class="content"><p>Cambridge 21 is kept separate from the main 01 → 13 learning path.</p>'+(cambridge.length?cambridge.map(renderBlock).join("<hr>"):"<p>No Cambridge 21 material is currently identified in the Markdown source.</p>")+"</div>";
  main.appendChild(cam);
  const ca=document.createElement("a");ca.href="#cambridge21";ca.textContent="C21 · CAMBRIDGE 21";toc.appendChild(ca);
  const links=[...toc.querySelectorAll("a")];
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle("active",a.hash==="#"+e.target.id));}),{rootMargin:"-20% 0px -65% 0px"});
  document.querySelectorAll(".system-section").forEach(x=>obs.observe(x));
 }catch(err){main.innerHTML='<div class="system-section"><div class="error"><strong>Unable to load the Markdown source.</strong><br>'+String(err.message).replace(/</g,"&lt;")+"</div></div>";}
}
init();
</script>
</body>
